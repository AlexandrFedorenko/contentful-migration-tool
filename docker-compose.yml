# Local development services. Run the app with `npm run dev` and `npm run worker:dev`.
# Ports are bound to localhost only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmt_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cmt}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
